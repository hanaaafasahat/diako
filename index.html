<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIAKO | مدیریت گیم‌کلاب</title>
<style>
:root{--bg:#f3f5fb;--cd:#fff;--ln:#d5dbea;--tx:#141a2e;--mu:#5d6785;--bl:#2563eb;--pk:#d9558f;--ok:#047857;--wn:#b45309;--bd:#dc2626;--in:#eef1f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1e;--cd:#121a30;--ln:#243052;--tx:#f4f6fb;--mu:#8f9bb8;--bl:#3b82f6;--pk:#f9a8c9;--ok:#34d399;--wn:#fbbf24;--bd:#f87171;--in:#0b1226}}
:root[data-theme="dark"]{--bg:#0a0f1e;--cd:#121a30;--ln:#243052;--tx:#f4f6fb;--mu:#8f9bb8;--bl:#3b82f6;--pk:#f9a8c9;--ok:#34d399;--wn:#fbbf24;--bd:#f87171;--in:#0b1226}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh}
.w{max-width:1050px;margin:auto;padding:14px}h2{margin:18px 0 8px;font-size:17px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.logo{font:800 26px/1 system-ui,sans-serif;letter-spacing:3px;color:var(--bl)}.logo i{color:var(--pk);font-style:normal}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:var(--tx)}
.b{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:9px 15px;min-height:44px;cursor:pointer}
.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
nav .b.on{border-color:var(--bl);box-shadow:0 0 0 1px var(--bl) inset}.b.p{background:var(--bl);border-color:var(--bl);color:#fff}
.b.g{color:var(--ok);border-color:var(--ok)}.b.y{color:var(--wn);border-color:var(--wn)}.b.r{color:var(--bd);border-color:var(--bd)}
input,select,textarea{background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:9px;min-height:44px;width:100%}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px}
.g4{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.s b{display:block;font-size:21px}.s span,.mu{color:var(--mu);font-size:13px}
.st{border-top:3px solid var(--mu)}.st.free{border-color:var(--ok)}.st.busy{border-color:var(--bl)}.st.hold{border-color:var(--wn)}
.t{font:700 30px/1.2 ui-monospace,monospace;direction:ltr;text-align:center;margin:8px 0}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1;min-width:0}.sp{justify-content:space-between;align-items:center}
.bg{font-size:12px;padding:1px 10px;border-radius:99px;border:1px solid currentColor}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:start;border-bottom:1px solid var(--ln)}
.bar{height:8px;background:var(--in);border-radius:8px}.bar i{display:block;height:8px;background:var(--bl);border-radius:8px}
#hi{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#hi .logo{font-size:54px}#hi h1{margin:0;font-size:30px}.mc{font-size:54px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.sk{background:none;border:0;color:var(--pk);font-size:22px;cursor:pointer;min-width:44px;min-height:44px}
#to{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--cd);border:1px solid var(--pk);border-radius:12px;padding:10px 16px;display:none;z-index:20;max-width:90vw}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.md .c{max-width:420px;width:100%}@media print{body>*:not(.md){display:none!important}.md{position:static;background:none;padding:0}.noprint{display:none!important}}.x{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.w{padding:10px}nav{overflow-x:auto;flex-wrap:nowrap;width:100%}nav .b{white-space:nowrap}.t{font-size:26px}}
</style></head><body>
<div id="hi"><div class="mc">🎮</div><div class="logo">DIA<i>K</i>O</div><h1>خوش اومدی نوید!</h1>
<p class="mu">باشگاه بازی‌ات، تحت کنترل. بیا امروز رو به یه روز عالی تبدیل کنیم.</p>
<button class="b p" id="go" style="padding:12px 40px">ورود به داشبورد</button>
<button class="sk" id="egg" aria-label="پیام کوچک">✦</button><p id="em" class="mu x">یه نفر با کلی ذوق اینجا رو برات قشنگ کرده 🎀</p></div>
<div class="w"><header><div class="logo">DIA<i>K</i>O</div><nav id="nv"></nav><button class="b" id="th" aria-label="تغییر پوسته">☾</button></header><main id="m"></main></div><div id="to" role="status"></div><datalist id="cl"></datalist>
<script>
const K='diako_web_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),fa=n=>new Intl.NumberFormat('fa-IR').format(n),T=n=>fa(Math.round(n))+' تومان';
const nz=v=>String(v).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const dt=m=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'short',timeStyle:'short'}).format(m);
const hms=m=>{const s=Math.floor(m/1e3);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const fresh=()=>({st:[['PS5 1','PS5'],['PS5 2','PS5'],['PS5 3','PS5'],['PS4','PS4']].map((x,i)=>({id:i+1,name:x[0],kind:x[1],rate:0})),ses:[],inv:[],prod:[],cu:[],ex:[],dc:[],cid:0,xid:0,did:0,cfg:{round:1000,step:1,min:0,excl:1},seq:1000,sid:0,pid:0});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!Array.isArray(S.st))S=fresh();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('ذخیره‌سازی در این مرورگر ممکن نیست')}};
function toast(t){const e=$('#to');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
let endBusy=false;
// in-page confirm dialog (the browser's confirm()/prompt() are blocked inside hosted pages)
function ask(title,body,ok,need){if(document.querySelector('.md'))return Promise.resolve(false);return new Promise(res=>{const d=document.createElement('div');d.className='md';d.innerHTML=`<div class="c" role="dialog" aria-modal="true"><b>${esc(title)}</b><p class="mu">${esc(body||'')}</p>${need?`<input id="mdi" placeholder="برای ادامه «${esc(need)}» را تایپ کنید">`:''}<div class="r" style="margin-top:10px"><button class="b p" id="mdo">${esc(ok||'تأیید')}</button><button class="b" id="mdn">انصراف</button></div></div>`;document.body.appendChild(d);
const k=e=>{if(e.key==='Escape')done(false)},done=v=>{d.remove();document.removeEventListener('keydown',k);res(v)};document.addEventListener('keydown',k);
d.querySelector('#mdo').onclick=()=>{const i=d.querySelector('#mdi');if(need&&i.value.trim()!==need){i.focus();return}done(true)};d.querySelector('#mdn').onclick=()=>done(false);(d.querySelector('#mdi')||d.querySelector('#mdo')).focus()})}
// ---- billing (runs in the browser in this edition) ----
const bms=(x,t)=>Math.max(0,(x.end??t)-x.start-(S.cfg.excl?x.pm+(x.pa&&!x.end?t-x.pa:0):0));
function price(m,rate){const c=S.cfg,min=Math.ceil(m/6e4),b=min?Math.ceil(min/c.step)*c.step:0;const raw=Math.max(Math.ceil(b*rate/60),c.min);return{b,total:Math.ceil(raw/c.round)*c.round}}
const pms=(x,t)=>Math.max(0,(x.end??t)-x.start-x.pm-(x.pa&&!x.end?t-x.pa:0)); // play time: always freezes while paused
const paid=i=>i.pay.reduce((a,p)=>a+p.a,0),open=id=>S.ses.find(x=>x.st===id&&!x.end),day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
let tab='dash',cart={},rng='today';
const TABS=[['dash','داشبورد'],['cus','مشتریان'],['store','فروشگاه'],['disc','تخفیف‌ها'],['exp','هزینه‌ها'],['rep','گزارش‌ها'],['set','تنظیمات']];
$('#nv').innerHTML=TABS.map(([k,l])=>`<button class="b" data-k="${k}">${l}</button>`).join('');
$('#nv').onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;render()}};
$('#go').onclick=()=>{$('#hi').classList.add('x');try{sessionStorage.w=1}catch(e){}};try{if(sessionStorage.w)$('#hi').classList.add('x')}catch(e){}
$('#egg').onclick=()=>$('#em').classList.toggle('x');
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
function render(){S.cu=S.cu||[];S.ex=S.ex||[];S.dc=S.dc||[];$('#cl').innerHTML=S.cu.map(c=>`<option value="${esc(c.name)}">`).join('');document.querySelectorAll('#nv .b').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));({dash,cus,store,disc,exp,rep,set})[tab]()}
// ---- dashboard ----
function dash(){const t0=day0(),now=Date.now(),inc=S.inv.reduce((a,i)=>a+i.pay.filter(p=>p.t>=t0).reduce((b,p)=>b+p.a,0)-(i.rf||[]).filter(p=>p.t>=t0).reduce((b,p)=>b+p.a,0),0),act=S.st.filter(s=>open(s.id)).length,
 done=S.ses.filter(x=>x.end>=t0).length,debt=S.inv.reduce((a,i)=>a+i.total-paid(i),0);
 $('#m').innerHTML=`<div class="g4"><div class="c s"><span>دریافتی امروز</span><b>${T(inc)}</b></div><div class="c s"><span>جلسه فعال</span><b>${fa(act)}</b></div><div class="c s"><span>ایستگاه آزاد</span><b>${fa(S.st.length-act)}</b></div><div class="c s"><span>جلسات تمام‌شده امروز</span><b>${fa(done)}</b></div><div class="c s"><span>مانده بدهی‌ها</span><b>${T(debt)}</b></div></div>
 <h2>ایستگاه‌ها</h2><div class="g3">${S.st.map(s=>{const x=open(s.id);return `<div class="c st ${x?(x.pa?'hold':'busy'):'free'}"><div class="r sp"><b>${esc(s.name)}</b><span class="bg">${x?(x.pa?'متوقف':'در حال بازی'):'آزاد'}</span></div><div class="mu">${esc(s.kind)} · ${s.rate?T(s.rate)+' / ساعت':'نرخ تنظیم نشده'}</div>
 ${x?`<div class="t" data-s="${x.id}">${hms(pms(x,now))}</div><div class="r sp"><span class="mu">${esc(x.cu||'مشتری حضوری')}</span><b data-c="${x.id}">${T(price(bms(x,now),s.rate).total)}</b></div><div class="mu">شروع: ${dt(x.start)}${x.pm||x.pa?` · مدت توقف: <span data-p="${x.id}">${hms(x.pm+(x.pa?now-x.pa:0))}</span>`:''}</div>
 <div class="r" style="margin-top:10px">${x.pa?`<button class="b g" onclick="resume(${x.id})">ادامه</button>`:`<button class="b y" onclick="pause(${x.id})">توقف</button>`}<button class="b r" onclick="endS(${x.id})">پایان</button></div>`
 :`<div class="r" style="margin-top:10px">${s.rate>0?`<input id="cu${s.id}" list="cl" placeholder="مشتری (اختیاری)"><button class="b p" onclick="start(${s.id})">شروع</button>`:`<button class="b" onclick="tab='set';render()">ثبت نرخ ساعتی</button>`}</div>`}</div>`}).join('')}</div>`}
setInterval(()=>{if(tab!=='dash')return;const now=Date.now();S.ses.filter(x=>!x.end).forEach(x=>{const t=document.querySelector(`.t[data-s="${x.id}"]`),c=document.querySelector(`[data-c="${x.id}"]`),s=S.st.find(y=>y.id===x.st);if(t)t.textContent=hms(pms(x,now));if(c&&s)c.textContent=T(price(bms(x,now),s.rate).total);const pp=document.querySelector('[data-p="'+x.id+'"]');if(pp)pp.textContent=hms(x.pm+(x.pa?now-x.pa:0))})},1000);
function start(id){const s=S.st.find(x=>x.id===id);if(!(s&&s.rate>0))return toast('ابتدا نرخ ساعتی را در تنظیمات وارد کنید');if(open(id))return;S.ses.push({id:++S.sid,st:id,cu:nz($('#cu'+id).value)||null,cid:cidOf(nz($('#cu'+id).value)),start:Date.now(),pa:null,pm:0,end:null});save();render()}
function pause(i){const x=S.ses.find(s=>s.id===i);if(!x||x.end||x.pa)return;x.pa=Date.now();save();render();toast(S.cfg.excl?'جلسه متوقف شد؛ زمان توقف از صورتحساب کسر می‌شود':'جلسه متوقف شد؛ طبق تنظیمات، زمان توقف هم محاسبه می‌شود')}
function resume(i){const x=S.ses.find(s=>s.id===i);if(!x||x.end||!x.pa)return;x.pm+=Date.now()-x.pa;x.pa=null;save();render();toast('جلسه ادامه یافت ✦')}
async function endS(i){let x=S.ses.find(s=>s.id===i);if(!x||x.end||endBusy)return;const s0=S.st.find(y=>y.id===x.st),m0=bms(x,Date.now());endBusy=true;const yes=await ask('پایان جلسه‌ی '+s0.name+'؟','مدت قابل محاسبه '+hms(m0)+' · مبلغ تقریبی '+T(price(m0,s0.rate).total),'پایان و صدور فاکتور');endBusy=false;if(!yes)return;x=S.ses.find(s=>s.id===i);if(!x||x.end)return;const t=Date.now();if(x.pa){x.pm+=t-x.pa;x.pa=null}x.end=t;
 const s=S.st.find(y=>y.id===x.st),m=bms(x,t),p=price(m,s.rate);const dv=discFor('g',p.total,t),dsc=dv?Math.max(0,p.total-Math.ceil(Math.max(0,p.total-dv.amt)/S.cfg.round)*S.cfg.round):0;if(dv&&dsc>0)dv.d.used=(dv.d.used||0)+1;S.inv.push({n:++S.seq,kind:'g',cid:x.cid||null,st:s.id,sn:s.name,cu:x.cu,at:t,sub:p.total,disc:dsc,dn:dsc?dv.d.name:null,total:p.total-dsc,b:p.b,rate:s.rate,round:S.cfg.round,items:[],pay:[],rf:[]});save();tab='rep';RF.p='today';render();toast(`فاکتور ${fa(S.seq)} صادر شد: ${T(p.total-dsc)}${dsc?` (تخفیف ${T(dsc)})`:''} ✦`)}
function payInv(n,m){const i=S.inv.find(x=>x.n===n);if(!i||paid(i)>=i.total)return;i.pay.push({m,a:i.total-paid(i),t:Date.now()});save();toast('پرداخت ثبت شد ✦');render()}
// ---- store ----
function store(){const P=S.prod,sum=P.reduce((a,p)=>a+(cart[p.id]||0)*p.price,0);
 $('#m').innerHTML=`<h2>فروشگاه</h2><div class="c sc"><table><tr><th>کالا</th><th>قیمت</th><th>موجودی</th><th>تعداد خرید</th><th>موجودی ±</th></tr>${P.map(p=>`<tr><td>${esc(p.name)}</td><td>${T(p.price)}</td><td style="color:${p.stock<=p.min?'var(--bd)':'inherit'}">${fa(p.stock)}${p.stock<=p.min?' ⚠':''}</td>
 <td><input type="number" min="0" max="${p.stock}" value="${cart[p.id]||0}" style="width:80px" onchange="cart[${p.id}]=Math.max(0,Math.min(${p.stock},+this.value||0));store()"></td><td><button class="b" onclick="stk(${p.id},1)">+</button> <button class="b" onclick="stk(${p.id},-1)">−</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">هنوز کالایی تعریف نشده؛ از فرم پایین اولین کالا را اضافه کنید ✦</td></tr>'}</table></div>
 <div class="c" style="margin-top:12px"><div class="g3"><input id="sc" list="cl" placeholder="مشتری (اختیاری)"><select id="sm"><option value="cash">نقد</option><option value="card">کارت</option><option value="">پرداخت بعداً</option></select><button class="b p" ${sum?'':'disabled'} onclick="sell()">ثبت فروش — ${T(sum)}</button></div></div>
 <div class="c" style="margin-top:12px"><b>کالای جدید</b><div class="g3" style="margin-top:8px"><input id="pn" placeholder="نام"><input id="pc" inputmode="numeric" placeholder="قیمت خرید (تومان)"><input id="pp" inputmode="numeric" placeholder="قیمت فروش (تومان)"><input id="ps" inputmode="numeric" placeholder="موجودی اولیه"><input id="pm" inputmode="numeric" placeholder="حداقل موجودی"><button class="b p" onclick="addP()">افزودن</button></div></div>`}
function addP(){const n=nz($('#pn').value),pr=+nz($('#pp').value),st=+nz($('#ps').value||0),mn=+nz($('#pm').value||0);if(!n||!(pr>=0)||!(st>=0)||!(mn>=0)||S.prod.some(p=>p.name===n))return toast('نام یا مبلغ نامعتبر است یا کالا تکراری است');S.prod.push({id:++S.pid,name:n,price:pr,cost:+nz($('#pc').value||0)||0,stock:st,min:mn});save();toast('کالا افزوده شد ✦');store()}
function stk(id,d){const p=S.prod.find(x=>x.id===id);if(p&&p.stock+d>=0){p.stock+=d;save();store()}}
function sell(){const items=S.prod.filter(p=>cart[p.id]>0).map(p=>({id:p.id,name:p.name,qty:cart[p.id],unit:p.price,cost:p.cost||0}));if(!items.length)return;if(items.some(x=>x.qty>S.prod.find(p=>p.id===x.id).stock))return toast('موجودی کافی نیست');
 items.forEach(x=>S.prod.find(p=>p.id===x.id).stock-=x.qty);const total=items.reduce((a,x)=>a+x.qty*x.unit,0),m=$('#sm').value,at=Date.now(),dv=discFor('s',total,at),da=dv?dv.amt:0;if(da>0)dv.d.used=(dv.d.used||0)+1;const cn=nz($('#sc').value),i={n:++S.seq,kind:'s',cid:cidOf(cn),st:null,sn:'فروشگاه',cu:cn||null,at,sub:total,disc:da,dn:da?dv.d.name:null,total:total-da,items,pay:[],rf:[]};if(m&&i.total>0)i.pay.push({m,a:i.total,t:at});S.inv.push(i);cart={};save();toast(`فاکتور ${fa(i.n)} صادر شد: ${T(i.total)}${da?` (تخفیف ${T(da)})`:''} ✦`);store()}
// ---- report ----
function repOld(){const t0=day0(),D=864e5,from={today:t0,week:t0-6*D,month:t0-29*D,all:0}[rng],R=S.inv.filter(i=>i.at>=from).sort((a,b)=>b.at-a.at),tot=R.reduce((a,i)=>a+i.total,0),pd=R.reduce((a,i)=>a+paid(i),0);
 const by={};R.filter(i=>i.kind==='g').forEach(i=>{const b=by[i.sn]||(by[i.sn]={n:0,v:0,m:0});b.n++;b.v+=i.total;b.m+=i.b});const B=Object.entries(by).sort((a,b)=>b[1].v-a[1].v),mx=Math.max(1,...B.map(x=>x[1].v));
 $('#m').innerHTML=`<div class="r sp"><h2>گزارش و فاکتورها</h2><select id="rg" style="max-width:200px" onchange="rng=this.value;rep()">${[['today','امروز'],['week','۷ روز اخیر'],['month','۳۰ روز اخیر'],['all','همه']].map(([k,l])=>`<option value="${k}" ${k===rng?'selected':''}>${l}</option>`).join('')}</select></div>

 $('#m').innerHTML=`<h2>گزارش‌ها</h2><div class="c"><div class="g3">${sel('p',[['today','امروز'],['yesterday','دیروز'],['week','۷ روز اخیر'],['month30','۳۰ روز اخیر'],['thisMonth','ماه شمسی جاری'],['prevMonth','ماه شمسی قبل'],['year','سال شمسی جاری'],['all','همه'],['custom','بازه دلخواه']])}
 ${RF.p==='custom'?`<label class="mu">از<input type="date" value="${RF.f}" onchange="RFs('f',this.value)"></label><label class="mu">تا<input type="date" value="${RF.t}" onchange="RFs('t',this.value)"></label>`:''}
 ${sel('k',[['','همه انواع'],['g','بازی'],['s','فروشگاه']])}${sel('st',[['','همه ایستگاه‌ها'],...S.st.map(s=>[s.id,s.name])])}${sel('cu',[['','همه مشتریان'],...S.cu.map(c=>[c.id,c.name])])}${sel('ss',[['','همه وضعیت‌ها'],['unpaid','پرداخت‌نشده'],['part','ناقص'],['paid','پرداخت‌شده']])}
 ${sel('o',[['at','مرتب‌سازی: زمان'],['total','مرتب‌سازی: مبلغ']])}${sel('a',[[0,'نزولی'],[1,'صعودی']])}<input placeholder="جستجو: شماره فاکتور یا مشتری" value="${esc(RF.q)}" onchange="RFs('q',this.value)"></div>
 <div class="r" style="margin-top:10px"><button class="b" onclick="RF={p:'today',k:'',st:'',cu:'',ss:'',q:'',o:'at',a:0,f:'',t:''};rep()">بازنشانی</button><button class="b" onclick="csv()">خروجی CSV (کپی متن)</button></div></div>
 <div class="g4" style="margin-top:12px"><div class="c s"><span>تعداد فاکتور</span><b>${fa(R.length)}</b></div><div class="c s"><span>جمع نهایی</span><b>${T(tot)}</b></div><div class="c s"><span>تخفیف‌ها</span><b>${T(sumBy(R,i=>i.disc||0))}</b></div><div class="c s"><span>دریافتی خالص</span><b>${T(pd)}</b></div><div class="c s"><span>مانده</span><b>${T(tot-sumBy(R,paid))}</b></div><div class="c s"><span>میانگین هر فاکتور</span><b>${T(R.length?tot/R.length:0)}</b></div></div>
 <h2>خلاصه مالی بازه <span class="mu">(مستقل از فیلتر نوع، ایستگاه و مشتری)</span></h2><div class="g4"><div class="c s"><span>درآمد خالص (پس از بازپرداخت)</span><b>${T(revenue)}</b></div><div class="c s"><span>بازپرداخت‌ها</span><b>${T(refs)}</b></div><div class="c s"><span>بهای کالای فروخته‌شده</span><b>${T(cogs)}</b></div><div class="c s"><span>سود ناخالص</span><b>${T(gross)}</b></div><div class="c s"><span>هزینه‌های عملیاتی</span><b>${T(opex)}</b></div><div class="c s"><span>سود خالص</span><b style="color:${net<0?'var(--bd)':'var(--ok)'}">${T(net)}</b></div></div><p class="mu">خرید موجودی (${T(invp)}) جدا ثبت می‌شود و در سود دوباره کسر نمی‌شود.</p>
 <h2>درآمد روزانه <span class="mu">(<span style="color:var(--bl)">■</span> بازی <span style="color:var(--pk)">■</span> فروشگاه)</span></h2><div class="c">${C.length?`<div style="display:flex;gap:3px;direction:rtl;overflow-x:auto;align-items:flex-end;height:150px">${C.map(b=>`<div title="${b.l}: بازی ${T(b.g)} · فروشگاه ${T(b.s)}" style="flex:1;min-width:16px;height:100%;display:flex;flex-direction:column;justify-content:flex-end"><i style="display:block;height:${b.s/mx*100}%;background:var(--pk)"></i><i style="display:block;height:${b.g/mx*100}%;background:var(--bl)"></i></div>`).join('')}</div><div class="mu">بیشترین: ${T(mx)} · ${C[0].l} تا ${C[C.length-1].l}</div>`:'<span class="mu">برای نمودار روزانه بازه‌ی کوتاه‌تر از ۶۲ روز انتخاب کنید یا فاکتوری ثبت کنید ✦</span>'}</div>
 <h2>مقایسه ایستگاه‌ها</h2><div class="c">${B.map(([n,b])=>`<div style="margin:8px 0"><div class="r sp"><b>${esc(n)}</b><span class="mu">${fa(b.n)} جلسه · ${fa(b.m)} دقیقه · میانگین ${fa(Math.round(b.m/b.n))} دقیقه</span><b>${T(b.v)}</b></div><div class="bar"><i style="width:${b.v/mxs*100}%"></i></div></div>`).join('')||'<span class="mu">هنوز جلسه‌ای در این بازه ثبت نشده ✦</span>'}</div>
 <h2>پرفروش‌ترین کالاها</h2><div class="c">${TP.map(([n,p])=>`<div class="r sp"><span>${esc(n)} (${fa(p.q)} عدد)</span><span class="mu">سود ناخالص ${T(p.pf)}</span><b>${T(p.v)}</b></div>`).join('')||'<span class="mu">فروشی ثبت نشده</span>'}</div>
 <h2>فاکتورها</h2><div class="c sc"><table><tr><th>شماره</th><th>ایستگاه</th><th>مشتری</th><th>زمان</th><th>محاسبه</th><th>مبلغ</th><th>دریافتی</th><th>وضعیت</th><th></th></tr>${R.map(i=>{const pa=paid(i),rf=rfd(i);return `<tr><td>${fa(i.n)}</td><td>${esc(i.sn)}</td><td>${esc(i.cu||'-')}</td><td>${dt(i.at)}</td>
 <td class="mu">${i.kind==='s'?(i.items||[]).map(x=>`${esc(x.name)} ×${fa(x.qty)}`).join('، '):`${fa(i.b)} دقیقه × ${T(i.rate)}/ساعت${i.round>1?` · گرد به ${fa(i.round)}`:''}`}</td><td>${T(i.total)}${i.disc?`<div class="mu">تخفیف ${T(i.disc)}${i.dn?' ('+esc(i.dn)+')':''}</div>`:''}</td><td>${T(pa)}${rf?`<div class="mu">بازپرداخت ${T(rf)}</div>`:''}</td><td>${pa>=i.total?'پرداخت‌شده':pa?'ناقص':'پرداخت‌نشده'}</td>
 <td><button class="b" onclick="pv(${i.n})">چاپ</button> ${pa<i.total?`<button class="b g" onclick="payInv(${i.n},'cash')">نقد</button> <button class="b" onclick="payInv(${i.n},'card')">کارت</button>`:''}${pa===0&&!i.disc&&S.dc.some(d=>eligible(d,i.kind,subOf(i),Date.now()))?` <button class="b y" onclick="applyD(${i.n})">تخفیف</button>`:''}${pa-rf>0?` <button class="b r" onclick="refundDlg(${i.n})">بازپرداخت</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=9 class="mu">فاکتوری با این فیلترها پیدا نشد 🎮</td></tr>'}
 <tr style="font-weight:700"><td colspan=5>جمع (${fa(R.length)} فاکتور)</td><td>${T(tot)}</td><td>${T(pd)}</td><td colspan=2>مانده ${T(tot-sumBy(R,paid))}</td></tr></table></div>`}
function csv(){const c=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},st={true:'پرداخت‌شده'};
 showText('خروجی CSV',[['شماره','تاریخ شمسی','نوع','ایستگاه','مشتری','جمع جزء','تخفیف','مبلغ نهایی','دریافتی','بازپرداخت','مانده'],...rows().map(i=>[i.n,jf(i.at),i.kind==='s'?'فروشگاه':'بازی',i.sn,i.cu||'',subOf(i),i.disc||0,i.total,paid(i),rfd(i),i.total-paid(i)])].map(r=>r.map(c).join(',')).join('\n'))}
function pv(n){const i=S.inv.find(x=>x.n===n);if(!i)return;const d=document.createElement('div');d.className='md';const pa=paid(i),rf=rfd(i);
 d.innerHTML=`<div class="c" style="max-width:460px;width:100%;max-height:90vh;overflow:auto"><div class="r sp"><div class="logo">DIA<i>K</i>O</div><b>فاکتور ${fa(i.n)}</b></div><p class="mu">${dt(i.at)} · ${esc(i.cu||'مشتری حضوری')} · ${esc(i.sn)}</p><table>${i.kind==='s'?(i.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${fa(x.qty)} × ${T(x.unit)}</td><td>${T(x.qty*x.unit)}</td></tr>`).join(''):`<tr><td>بازی روی ${esc(i.sn)}</td><td>${fa(i.b)} دقیقه × ${T(i.rate)}/ساعت</td><td>${T(subOf(i))}</td></tr>`}</table>
 <p>جمع جزء: ${T(subOf(i))}${i.disc?`<br>تخفیف${i.dn?' ('+esc(i.dn)+')':''}: −${T(i.disc)}`:''}<br><b>مبلغ نهایی: ${T(i.total)}</b><br>پرداخت‌شده: ${T(pa)}${rf?`<br>بازپرداخت: ${T(rf)}`:''}<br>مانده: ${T(i.total-pa)}</p>
 <div class="r noprint"><button class="b p" id="pp2">چاپ / ذخیره PDF</button><button class="b" id="pc2">بستن</button></div><p class="mu noprint">اگر پنجره‌ی چاپ باز نشد، از منوی مرورگر Print را بزنید و «Save as PDF» را انتخاب کنید.</p></div>`;
 document.body.appendChild(d);d.querySelector('#pc2').onclick=()=>d.remove();d.querySelector('#pp2').onclick=()=>{try{window.print()}catch(e){toast('از منوی مرورگر Print را بزنید')}}}
// ---- settings & backup ----
function set(){const c=S.cfg;$('#m').innerHTML=`<h2>ایستگاه‌ها و قیمت‌گذاری</h2><div class="g3">${S.st.map(s=>`<div class="c"><b>${esc(s.name)}</b><p class="mu">نرخ ساعتی (تومان)</p><input id="r${s.id}" inputmode="numeric" value="${s.rate}" ${open(s.id)?'disabled':''}><button class="b p" style="margin-top:8px;width:100%" ${open(s.id)?'disabled':''} onclick="saveR(${s.id})">ذخیره</button></div>`).join('')}</div>
 <div class="c" style="margin:12px 0"><p class="mu">نحوه‌ی محاسبه (فقط توسط شما تعیین می‌شود)</p><div class="g3"><label>گام محاسبه (دقیقه)<input id="c1" inputmode="numeric" value="${c.step}"></label><label>حداقل مبلغ جلسه (تومان)<input id="c2" inputmode="numeric" value="${c.min}"></label><label>گرد کردن فاکتور به (تومان)<input id="c3" inputmode="numeric" value="${c.round}"></label>
 <label>زمان توقف<select id="c4"><option value="1" ${c.excl?'selected':''}>از صورتحساب کسر شود</option><option value="0" ${c.excl?'':'selected'}>محاسبه شود</option></select></label></div><button class="b p" style="margin-top:10px" onclick="saveC()">ذخیره</button></div>
 <div class="c"><b>پشتیبان و بازیابی</b><p class="mu">اطلاعات فقط در همین مرورگر ذخیره می‌شود. متن زیر را کپی و جایی امن نگه دارید؛ برای بازیابی، متن را در همین کادر بچسبانید.</p><textarea id="bk" rows="5" style="direction:ltr;font-family:ui-monospace,monospace"></textarea>
 <div class="r" style="margin-top:8px"><button class="b" onclick="$('#bk').value=JSON.stringify(S);$('#bk').select();toast('پشتیبان آماده است؛ کپی کنید ✦')">ساخت پشتیبان</button><button class="b y" onclick="imp()">بازیابی از متن</button><button class="b r" onclick="rst()">پاک‌کردن همه‌ی اطلاعات</button></div></div>`}
function saveR(id){const v=+nz($('#r'+id).value);if(!(Number.isInteger(v)&&v>=0))return toast('نرخ نامعتبر است');S.st.find(s=>s.id===id).rate=v;save();toast('ذخیره شد ✦');set()}
function saveC(){const a=+nz($('#c1').value),b=+nz($('#c2').value),d=+nz($('#c3').value);if(![a,b,d].every(Number.isInteger)||a<1||b<0||d<1)return toast('مقدار نامعتبر است');S.cfg={step:a,min:b,round:d,excl:+$('#c4').value};save();toast('ذخیره شد ✦')}
async function imp(){let o;try{o=JSON.parse($('#bk').value)}catch(e){return toast('متن پشتیبان معتبر نیست')}if(!o||!Array.isArray(o.st)||!Array.isArray(o.inv)||!Array.isArray(o.ses)||!o.cfg)return toast('ساختار پشتیبان معتبر نیست');
 if(S.ses.some(x=>!x.end))return toast('ابتدا جلسه‌های فعال را پایان دهید');if(!await ask('بازیابی از پشتیبان','همه‌ی اطلاعات فعلی با پشتیبان جایگزین می‌شود.','بازیابی'))return;S=o;save();toast('بازیابی شد ✦');render()}
async function rst(){if(!await ask('پاک‌کردن همه‌ی اطلاعات','این کار قابل بازگشت نیست.','پاک کن','حذف'))return;S=fresh();save();render()}
render();
</script></body></html>
